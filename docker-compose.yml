services:
  music-player:
    image: ghcr.io/lolcoded/music-player:latest  # or build: . to build locally
    container_name: music-player
    ports:
      - "4533:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
